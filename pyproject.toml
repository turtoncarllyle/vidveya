[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vidveya"
version = "0.1.2"
description = "VidVeya — local YouTube video downloads with audio"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6-Essentials==6.11.2", "yt-dlp[default]==2026.8.19"]

[project.gui-scripts]
vidveya = "vidveya.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
markers = ["integration: requires bundled media tools"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
