name: Build and release VidVeya

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements-build.lock
      - run: python -m pytest -q
      - run: python -m ruff check src scripts tests
      - run: python scripts/build.py
      - uses: softprops/action-gh-release@v2
        with:
          name: VidVeya ${{ github.ref_name }}
          draft: false
          body_path: release/RELEASE_NOTES_CURRENT.md
          files: |
            release/VidVeya-*-win-x64-setup.exe
            release/VidVeya-*-win-x64-portable.zip
            release/SHA256SUMS.txt
